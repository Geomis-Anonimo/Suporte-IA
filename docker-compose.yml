# Compose central da pasta CLAUDE: cada servico novo entra aqui como um novo "service".
# Subir tudo: docker compose up -d --build   (variaveis vem do arquivo .env desta pasta)
name: claude-servicos

services:
  api:
    build: ./app/api
    container_name: api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # so acessivel na propria maquina
    environment:
      TZ: America/Sao_Paulo
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./app/api/data:/data   # SQLite de todos os modulos em app/api/data/api.db
