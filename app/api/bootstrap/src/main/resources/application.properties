spring.application.name=api
server.port=8080
server.address=127.0.0.1

# SQLite unico para todos os modulos (no Docker: /data/api.db). Pool de 1 conexao: SQLite aceita 1 escritor.
spring.datasource.url=jdbc:sqlite:api.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
# Cada modulo traz o proprio schema em db/<modulo>-schema.sql (CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:db/*-schema.sql

spring.jackson.deserialization.fail-on-unknown-properties=true

# ---- shared (todos os modulos)
api.fuso=America/Sao_Paulo
# Segredos vem SEMPRE de variavel de ambiente (nunca gravar aqui)
api.discord.webhook-url=${DISCORD_WEBHOOK_URL:}

# ---- modulo lembretes
lembretes.antecedencia-padrao-min=5
lembretes.job.intervalo-ms=60000
lembretes.job.janela-extra-min=1
lembretes.job.tolerancia-atraso-min=10
