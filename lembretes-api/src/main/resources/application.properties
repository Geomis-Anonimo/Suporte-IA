spring.application.name=lembretes-api
server.port=8080
server.address=127.0.0.1

# SQLite (arquivo local na pasta de execucao). Pool de 1 conexao: SQLite aceita 1 escritor.
spring.datasource.url=jdbc:sqlite:lembretes.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jackson.deserialization.fail-on-unknown-properties=true

# Regras do lembrete
lembretes.fuso=America/Sao_Paulo
lembretes.antecedencia-padrao-min=5
lembretes.job.intervalo-ms=60000
lembretes.job.janela-extra-min=1
lembretes.job.tolerancia-atraso-min=10

# Segredos vem SEMPRE de variavel de ambiente (nunca gravar aqui)
lembretes.discord.webhook-url=${DISCORD_WEBHOOK_URL:}
lembretes.claude.api-key=${ANTHROPIC_API_KEY:}
lembretes.claude.modelo=claude-haiku-5-5

# Raiz para resolver o caminho dos .md de contexto (relativo a pasta lembretes-api)
lembretes.contexto-raiz=..
